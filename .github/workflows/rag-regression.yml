name: RAG Regression Gate

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/rag-regression.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      # Real local LLM in CI: no API key needed/leaked in a fork PR context.
      # Swap this step out (and set OPENAI_API_KEY / DEEPSEEK_API_KEY as a repo
      # secret + LLM_PROVIDER env below) if you'd rather gate against a hosted model.
      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull mistral

      - name: Run unit + ACL + failure-classifier tests
        working-directory: backend
        env:
          LLM_PROVIDER: ollama
        run: pytest tests/ -v

      - name: Run golden-dataset regression gate
        working-directory: backend
        env:
          LLM_PROVIDER: ollama
          OLLAMA_BASE_URL: http://localhost:11434/v1
          OLLAMA_MODEL: phi3:lite
          VECTOR_STORE: chroma
          FAITHFULNESS_GATE: "0.85"
        run: python ci/run_regression.py

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: backend/ci/reports/*.json
