services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpass
      POSTGRES_DB: rag_observability
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raguser -d rag_observability"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # First run: `docker compose exec ollama ollama pull mistral`

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./backend/.env
    environment:
      PG_DSN: postgresql://raguser:ragpass@postgres:5432/rag_observability
      OLLAMA_BASE_URL: http://ollama:11434/v1
      CORS_ORIGINS: http://localhost:3000
      DEBUG_API_KEY: ${DEBUG_API_KEY:-}
      API_ACCESS_KEY: ${API_ACCESS_KEY:-}
    volumes:
      - ./backend/data:/app/data
      - ./backend/ci/reports:/app/ci/reports
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      INTERNAL_API_URL: http://backend:8000
      DEBUG_API_KEY: ${DEBUG_API_KEY:-}
      API_ACCESS_KEY: ${API_ACCESS_KEY:-}
    depends_on:
      - backend

volumes:
  pg_data:
  ollama_data:
